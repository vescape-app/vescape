name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      # The Android SDK download is independent of everything JS, so it overlaps
      # with install + the pure-JS checks. Only the Gradle test below needs both.
      - run: bun install
      - run: bun run copy:shared
      - parallel:
          - name: Install Android SDK components
            run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
          - run: bun run ts
          - run: bun run lint
          - run: bun run format:check
          - run: bun run knip
          - run: bun run test:bun
          - run: bun run release-notes:check
      - run: bun x expo prebuild --platform android --no-install
      - run: bun run test:android
      - name: Release Gradle file handles
        if: always()
        run: cd android && ./gradlew --stop || true
