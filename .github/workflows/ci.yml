name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      # The Android SDK download is independent of everything JS, so it overlaps
      # with install + the pure-JS checks. Only the Gradle test below needs both.
      - run: bun install
      - run: bun run copy:shared
      - parallel:
          - name: Install Android SDK components
            run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
          - run: bun run ts
          - run: bun run lint
          - run: bun run format:check
          - run: bun run knip
          - run: bun run test:bun
          - run: bun run release-notes:check
      - run: bun x expo prebuild --platform android --no-install
      - run: bun run test:android
      - name: Release Gradle file handles
        if: always()
        run: cd android && ./gradlew --stop || true

  # Swift only ever compiled in the release build, so a type error in `modules/vescape-core/ios`
  # escaped every PR and failed at TestFlight time. This is the iOS half of `test:android`: the
  # SwiftPM package globs the same tree CocoaPods ships, so the tests cannot run without compiling
  # it. macOS minutes are expensive, hence the path gate.
  ios-changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'modules/*/ios/**'
              - 'modules/*/Package.swift'
              - 'scripts/test-ios.ts'
              - 'scripts/native-sync.ts'
              - '.github/workflows/ci.yml'

  ios:
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('modules/vescape-core/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: List available simulators
        run: xcrun simctl list devices available
      - run: bun run test:ios
        env:
          # A cold Swift build of the whole module is far past the local default.
          IOS_TEST_TIMEOUT_MS: '1800000'
