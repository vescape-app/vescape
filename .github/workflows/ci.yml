name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

# Replace obsolete PR checks, while keeping a verdict for every dev/main commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  persistence-contracts:
    uses: ./.github/workflows/persistence-contracts.yml
    with:
      source_sha: ${{ github.sha }}

  # Full app-native builds cost minutes and require SDKs. Keep those filtered by platform source;
  # the host-only persistence contract above remains unconditional because shared fixtures and
  # archive exchange span both implementations.
  native-gate:
    name: Native gate
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'shared/**'
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - '.github/workflows/ci.yml'
            android:
              - *shared
              - 'modules/*/android/**'
              - 'modules/*/*.podspec'
              - 'plugins/**'
              - 'watch/**'
              - 'app.config.ts'
              - 'scripts/generate-android-theme.ts'
              - 'scripts/copy-shared.ts'
            ios:
              - *shared
              - 'modules/*/ios/**'
              - 'modules/*/Package.swift'
              - 'scripts/test-ios.ts'
              - 'scripts/native-sync.ts'

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run copy:shared
      - run: bun run ts
      - run: bun run lint
      - run: bun run comments:check
      - run: bun run format:check
      - run: bun run knip
      - run: bun run test:bun
      - run: bun run release-notes:check

  android:
    needs: native-gate
    if: needs.native-gate.outputs.android == 'true'
    runs-on: ubuntu-24.04
    env:
      # Maven Central answers bursts with 429; Gradle retries those, so give it more room.
      GRADLE_OPTS: >-
        -Dorg.gradle.caching=true -Dorg.gradle.daemon=false
        -Dorg.gradle.internal.repository.max.retries=8
        -Dorg.gradle.internal.repository.initial.backoff=2000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v5
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-android-lint-v1-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.config.ts', 'package.json', 'modules/vescape-core/android/build.gradle', 'watch/wearos/build.gradle') }}
          restore-keys: |
            gradle-ci-android-lint-v1-${{ runner.os }}-
            gradle-${{ runner.os }}-
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: bun install
      - run: bun run copy:shared
      - run: bun x expo prebuild --platform android --no-install
      - run: bun run test:android
      - run: bun run lint:android
      - name: Release Gradle file handles
        if: always()
        run: cd android && ./gradlew --stop || true
      # Save only after tests and lint pass so an immutable key never freezes a partial download.
      - uses: actions/cache/save@v5
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  # Swift was only ever compiled in the release build, so a type error in `modules/vescape-core/ios`
  # escaped every PR and failed at TestFlight time. The SwiftPM package globs the same tree
  # CocoaPods ships, so the tests cannot run without compiling it.
  ios:
    needs: native-gate
    if: github.event_name == 'workflow_dispatch' || needs.native-gate.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('modules/vescape-core/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Prepare an available iOS test simulator
        timeout-minutes: 15
        run: |
          bun run - <<'JS'
          import { appendFileSync } from 'node:fs'

          function simctl(args, timeout, capture = false, attempts = 1) {
            for (let attempt = 1; attempt <= attempts; attempt++) {
              const result = Bun.spawnSync(['xcrun', 'simctl', ...args], {
                stdout: capture ? 'pipe' : 'inherit', stderr: 'pipe', timeout,
              })
              if (result.success) return capture ? result.stdout.toString() : ''
              console.error(`simctl ${args.join(' ')} attempt ${attempt}/${attempts} failed after ${timeout}ms; exit=${result.exitCode}, signal=${result.signalCode}`)
              const stderr = result.stderr.toString().trim()
              if (stderr) console.error(stderr)
            }
            throw new Error(`simctl ${args.join(' ')} failed`)
          }
          // A hosted macOS runner can still be starting CoreSimulator when this step begins.
          const inventory = JSON.parse(simctl(['list', 'devices', 'available', '--json'], 120_000, true, 2))
          const selected = Object.entries(inventory.devices)
            .filter(([runtime]) => runtime.includes('.iOS-'))
            .flatMap(([, devices]) => devices)
            .find((device) => device.name === 'iPhone 17' && device.isAvailable)
          if (!selected) {
            console.error(JSON.stringify(inventory, null, 2))
            simctl(['list', 'runtimes'], 60_000)
            throw new Error('No available iPhone 17 simulator on this runner.')
          }
          console.log(`Preparing iPhone 17 (${selected.udid})`)
          if (selected.state !== 'Booted') simctl(['boot', selected.udid], 300_000)
          // First boot on a fresh image can spend several minutes migrating system apps.
          simctl(['bootstatus', selected.udid, '-b'], 600_000)
          appendFileSync(process.env.GITHUB_ENV,
            `IOS_TEST_DESTINATION=platform=iOS Simulator,id=${selected.udid}\n`)
          JS
      - name: Run iOS tests with one retry for simulator audio cleanup timeout
        shell: bash
        run: |
          log=$(mktemp /tmp/vesc-ios-tests-retry-XXXXXX)
          if bun run test:ios 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi
          if ! grep -Fq 'Cleanup: RPC timeout. Apparently deadlocked. Aborting now.' "$log"; then
            exit "$status"
          fi
          echo '::warning::Simulator audio cleanup timed out; retrying the iOS suite once in a fresh test process.'
          bun run test:ios
        env:
          # A cold Swift build of the whole module is far past the local default.
          IOS_TEST_TIMEOUT_MS: '1800000'
      - name: Upload iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: /tmp/vesc-ios-tests-*
          include-hidden-files: true
          retention-days: 7
