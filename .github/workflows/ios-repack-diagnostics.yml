name: iOS repack diagnostics

on:
  push:
    branches: [ci-ios-repack]
    paths: ['.github/workflows/ios-repack-diagnostics.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Four cold launches / ${{ matrix.kind }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: compiled
            run: '37194927073'
          - kind: repacked
            run: '37198675431'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - name: Download existing app artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ matrix.run }}
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -n smoke-ios-app -D .expo/smoke
          tar -xzf .expo/smoke/smoke-ios.tar.gz -C .expo/smoke
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Probe repeated cold process launches
        timeout-minutes: 20
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
          PROBE_KIND: ${{ matrix.kind }}
        run: bun run scripts/ios-launch-diagnostics.ts .expo/smoke/vescape.app
      - name: Reject native crash reports
        if: always()
        shell: bash
        run: |
          mkdir -p .expo/ios-launch-diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices" \
            -type f \( -iname 'vescape*.ips' -o -iname 'vescape*.crash' \) \
            -print > .expo/ios-launch-diagnostics/crash-reports.txt 2>/dev/null || true
          if [ -s .expo/ios-launch-diagnostics/crash-reports.txt ]; then
            cat .expo/ios-launch-diagnostics/crash-reports.txt
            mkdir -p .expo/ios-launch-diagnostics/crash-reports
            while IFS= read -r report; do
              cp "$report" .expo/ios-launch-diagnostics/crash-reports/
            done < .expo/ios-launch-diagnostics/crash-reports.txt
            echo 'Vescape crashed during the startup probe.'
            exit 1
          fi
      - name: Retain native crash reports and Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-repack-diagnostics-${{ matrix.kind }}
          path: |
            ~/.maestro/tests/
            .expo/ios-launch-diagnostics/
            ~/Library/Logs/DiagnosticReports/vescape*
            ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/CrashReporter/vescape*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 3
