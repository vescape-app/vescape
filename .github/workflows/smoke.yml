# Build each platform once, then run each flow with an isolated fixture session.
name: Smoke

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'modules/**'
      - 'shared/**'
      - 'plugins/**'
      - 'patches/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'assets/images/**'
      - 'app.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
    inputs:
      flow:
        description: Single flow to run (e.g. 03-history). Empty runs all of them.
        required: false
        type: string
      platform:
        description: Platform to verify
        type: choice
        default: both
        options: [both, android, ios]

# Finish the active run and keep the latest pending run. Jobs within a run execute in parallel.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      flows: ${{ steps.flows.outputs.flows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - id: flows
        env:
          SMOKE_FLOW: ${{ inputs.flow }}
        run: |
          args=(--list-flows)
          if [ -n "$SMOKE_FLOW" ]; then args+=(--flow "$SMOKE_FLOW"); fi
          flows=$(bun run scripts/smoke.ts "${args[@]}")
          echo "flows=$flows" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android smoke APK
    needs: plan
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SERVER_URL: https://api.vescape.app
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_MAPY_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPY_API_KEY }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v5
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.config.ts') }}-${{ github.sha }}
          restore-keys: |
            gradle-smoke-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.config.ts') }}-
            gradle-smoke-${{ runner.os }}-
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: bun install --frozen-lockfile
      - name: Build without an emulator
        run: bun run smoke --build-only --output .expo/smoke/app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-android-app
          path: .expo/smoke/app.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Save Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  build-ios:
    name: Build iOS smoke app
    needs: plan
    if: inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SERVER_URL: https://api.vescape.app
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_MAPY_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPY_API_KEY }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: xcode
        run: |
          echo "version=$({ xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - name: Fingerprint native smoke inputs
        id: native-fingerprint
        # If fingerprinting cannot establish compatibility, use a full build without caching it.
        continue-on-error: true
        run: bun run scripts/ios-smoke-repack.ts fingerprint
      - name: Restore matching native app
        id: native-app
        if: steps.native-fingerprint.outputs.hash != ''
        uses: actions/cache/restore@v5
        with:
          path: .expo/smoke/ios-native-base
          # Exact matches only. A different native fingerprint must compile again.
          key: ios-smoke-native-v1-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.native-fingerprint.outputs.hash }}
      - name: Repack current JavaScript and assets
        id: repack
        if: steps.native-app.outputs.cache-hit == 'true'
        # A cache or repack failure must still allow a verified full build.
        continue-on-error: true
        env:
          NATIVE_FINGERPRINT: ${{ steps.native-fingerprint.outputs.hash }}
        run: bun run scripts/ios-smoke-repack.ts repack "$NATIVE_FINGERPRINT"
      - name: Report repack fallback
        if: steps.repack.outcome == 'failure'
        run: echo '::warning::iOS repack failed; rebuilding from source. The existing native cache entry will not be replaced.'
      - uses: actions/cache/restore@v5
        id: pods-cache
        if: steps.native-app.outputs.cache-hit != 'true' || steps.repack.outcome == 'failure'
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            ios/Pods
          key: ios-smoke-pods-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('bun.lock', 'app.config.ts', 'plugins/**') }}-${{ github.sha }}
          restore-keys: |
            ios-smoke-pods-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('bun.lock', 'app.config.ts', 'plugins/**') }}-
      - name: Build without a simulator
        if: steps.native-app.outputs.cache-hit != 'true' || steps.repack.outcome == 'failure'
        run: |
          # Never merge a full build into a partially repacked bundle.
          rm -rf .expo/smoke/vescape.app
          bun run smoke --platform ios --build-only --output .expo/smoke/vescape.app
      - name: Record native app provenance
        if: steps.native-app.outputs.cache-hit != 'true' && steps.native-fingerprint.outputs.hash != ''
        env:
          NATIVE_FINGERPRINT: ${{ steps.native-fingerprint.outputs.hash }}
        run: bun run scripts/ios-smoke-repack.ts record "$NATIVE_FINGERPRINT"
      - name: Cache native app
        if: steps.native-app.outputs.cache-hit != 'true' && steps.native-fingerprint.outputs.hash != ''
        uses: actions/cache/save@v5
        with:
          path: .expo/smoke/ios-native-base
          key: ${{ steps.native-app.outputs.cache-primary-key }}
      # A tar archive preserves the executable permissions and symlinks inside the app bundle.
      - name: Package simulator app
        run: tar -czf "$RUNNER_TEMP/smoke-ios.tar.gz" -C .expo/smoke vescape.app
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-ios-app
          path: ${{ runner.temp }}/smoke-ios.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Save CocoaPods cache
        if: success() && (steps.native-app.outputs.cache-hit != 'true' || steps.repack.outcome == 'failure') && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            ios/Pods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

  smoke-android:
    name: Android / ${{ matrix.flow }}
    needs: [plan, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(needs.plan.outputs.flows) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: smoke-android-app
          path: .expo/smoke
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated flow
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_FLOW: ${{ matrix.flow }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Keep the Pixel 6 layout in dp while reducing software-rendered pixels by 56%.
          pre-emulator-launch-script: >-
            sed -i
            -e 's/^hw.lcd.width=.*/hw.lcd.width=720/'
            -e 's/^hw.lcd.height=.*/hw.lcd.height=1600/'
            -e 's/^hw.lcd.density=.*/hw.lcd.density=280/'
            "$HOME/.android/avd/test.avd/config.ini"
          emulator-options: >-
            -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
            -noaudio -camera-back none
          disable-animations: false
          script: |
            adb -s emulator-5554 shell wm size
            adb -s emulator-5554 shell wm density
            bun run smoke --app .expo/smoke/app.apk --device emulator-5554 --flow "$SMOKE_FLOW"
      - name: Upload Maestro debug output
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-android-${{ matrix.flow }}
          path: ~/.maestro/tests/
          if-no-files-found: warn
          retention-days: 3

  smoke-ios:
    name: iOS / ${{ matrix.flow }}
    needs: [plan, build-ios]
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(needs.plan.outputs.flows) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: smoke-ios-app
          path: .expo/smoke
      - name: Unpack simulator app
        run: tar -xzf .expo/smoke/smoke-ios.tar.gz -C .expo/smoke
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run isolated flow
        # Include fresh simulator startup and Maestro's XCTest shutdown, not just assertions.
        timeout-minutes: 20
        env:
          SMOKE_FLOW: ${{ matrix.flow }}
          # A fresh hosted simulator can take over two minutes to start XCTest.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: >-
          bun run smoke --platform ios --app .expo/smoke/vescape.app
          --device 'iPhone 17' --flow "$SMOKE_FLOW"
      - name: Upload Maestro debug output
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-ios-${{ matrix.flow }}
          path: ~/.maestro/tests/
          if-no-files-found: warn
          retention-days: 3
