appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: E2E Board
    timeout: 15000
- tapOn:
    id: floating-bar-connect
- assertVisible: Connecting…
- extendedWaitUntil:
    visible:
      id: board-disconnect-button
    timeout: 15000

- assertVisible:
    id: telemetry-motor-temp-cell
- assertVisible:
    id: telemetry-controller-temp-cell
- assertVisible:
    id: telemetry-motor-current-cell
- assertVisible:
    id: telemetry-battery-current-cell
- assertVisible:
    id: battery-bar

# Editing lives in the board selector now, not on the pill.
- tapOn:
    id: board-selector-trigger
- tapOn:
    id: board-edit-button
- assertVisible: 21s2p.*
- tapOn:
    id: edit-board-name-edit
# The field mounts focused with its text selected; tapping it again would drop the cursor
# mid-word and leave a tail behind the erase.
- eraseText: 50
- inputText: E2E Renamed Board
- pressKey: Enter
- assertVisible: E2E Renamed Board

- tapOn:
    id: edit-board-battery-row
- tapOn:
    id: edit-board-battery-manual-mode
- tapOn:
    id: edit-board-battery-manual-min-input
- eraseText
- inputText: 70
- hideKeyboard
- tapOn:
    id: edit-board-battery-manual-max-input
- eraseText
- inputText: 84
- hideKeyboard
- tapOn:
    id: edit-board-battery-save
- assertVisible: Manual voltage range

- back
- assertVisible: E2E Renamed Board
- tapOn:
    id: board-disconnect-button
- extendedWaitUntil:
    visible:
      id: floating-bar-connect
    timeout: 15000
- tapOn:
    id: floating-bar-connect
- assertVisible: Connecting…
- extendedWaitUntil:
    visible:
      id: board-disconnect-button
    timeout: 15000
- assertVisible: E2E Renamed Board
- assertVisible:
    id: telemetry-motor-temp-cell
