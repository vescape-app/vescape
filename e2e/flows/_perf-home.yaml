appId: ${APP_ID}
---
- runFlow: _launch.yaml
- openLink: 'vescape://e2e-seed?flow=connect-board'
- extendedWaitUntil:
    visible: E2E Board
    timeout: 15000
- tapOn:
    id: floating-bar-connect
- extendedWaitUntil:
    visible:
      id: board-disconnect-button
    timeout: 15000
- assertVisible:
    id: battery-bar
