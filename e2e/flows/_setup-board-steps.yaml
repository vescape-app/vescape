appId: ${APP_ID}
---
- tapOn:
    id: board-selector-trigger
- tapOn:
    id: board-selector-add-board

- extendedWaitUntil:
    visible: Pair your board
    timeout: 15000
- extendedWaitUntil:
    visible: E2E VESC Board
    timeout: 15000
- tapOn: E2E VESC Board

- scrollUntilVisible:
    element:
      id: add-board-link-save
    direction: DOWN
    timeout: 15000
- tapOn:
    id: add-board-link-save
- extendedWaitUntil:
    visible:
      id: add-board-name-input
    timeout: 15000
- tapOn:
    id: add-board-name-input
    # The suggested name is editable in place. Put the cursor at its end before erasing.
    point: '95%,50%'
- eraseText: 50
- inputText: E2E Board
- assertVisible:
    id: add-board-name-input
    text: E2E Board
- hideKeyboard
- tapOn:
    id: add-board-name-next

- assertVisible: Battery config
- tapOn:
    id: add-board-battery-series-increment
- tapOn:
    id: add-board-battery-next

- extendedWaitUntil:
    visible:
      id: add-board-skip-alerts
    timeout: 15000
- tapOn:
    id: add-board-skip-alerts

- assertVisible: Review & save
- assertVisible: E2E Board
- assertVisible: 'E2E VESC Board · Direct.*'
- tapOn:
    id: add-board-save

- assertVisible: E2E Board
# Selection in the E2E fake does not run native auto-connect. Connect the saved board explicitly.
- extendedWaitUntil:
    visible:
      id: floating-bar-connect
    timeout: 15000
- tapOn:
    id: floating-bar-connect
- extendedWaitUntil:
    visible:
      id: board-disconnect-button
    timeout: 15000
- assertVisible:
    id: battery-bar
