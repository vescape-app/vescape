# Requires the development app already connected to this workspace's Metro server.
# Preserves app data; no E2E fake board or state reset is needed.
appId: ${APP_ID}
---
- openLink: 'vescape://settings/components/buttons'
- extendedWaitUntil:
    visible: IconButton
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '85%'
    direction: DOWN
    timeout: 20000
- tapOn:
    text: '10%'
    waitToSettleTimeoutMs: 1000
- assertVisible: progress
- tapOn:
    text: '85%'
    waitToSettleTimeoutMs: 1000
- assertVisible: progress
