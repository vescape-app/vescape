# Temporary startup stress probe. One driver session, four fresh app processes.
appId: ${APP_ID}
---
- evalScript: ${output.iteration = 0}
- repeat:
    times: 4
    commands:
      - evalScript: ${output.iteration++; console.log(PROBE_KIND + ' launch ' + output.iteration + ' ' + new Date().toISOString())}
      # Preserve Documents/fixture ZIP. Keychain clearing exercises credential creation again.
      - launchApp:
          clearState: false
          clearKeychain: true
          stopApp: true
      - runFlow:
          file: ../fixture/_boot.yaml
          env:
            APP_ALREADY_LAUNCHED: 'true'
      - assertVisible:
          id: replay-badge
      - evalScript: ${output.deadline = new Date().getTime() + 45000; output.samples = 0}
      - repeat:
          while:
            true: ${new Date().getTime() < output.deadline}
          commands:
            # Each assertion asks XCTest for the current accessibility hierarchy.
            - assertVisible:
                id: battery-bar
            - assertVisible:
                id: replay-badge
            - assertVisible:
                id: gauge-speed
            - evalScript: ${output.samples++}
      - takeScreenshot: ${'ios-launch-' + output.iteration}
      - evalScript: ${console.log(PROBE_KIND + ' completed ' + output.iteration + ' samples=' + output.samples + ' ' + new Date().toISOString())}
