appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${typeof APP_ALREADY_LAUNCHED === 'undefined' || APP_ALREADY_LAUNCHED !== 'true'}
    commands:
      - launchApp
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - runFlow:
                when:
                  visible: 'Allow While Using App'
                commands:
                  - tapOn:
                      text: 'Allow While Using App'
                      waitToSettleTimeoutMs: 1000
      - runFlow:
          when:
            platform: Android
          commands:
            - runFlow:
                when:
                  visible: "Pixel Launcher isn't responding"
                commands:
                  - tapOn:
                      id: android:id/aerr_close
      - extendedWaitUntil:
          visible:
            id: battery-bar
          timeout: 20000
