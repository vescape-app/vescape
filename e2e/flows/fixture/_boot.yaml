# Boot a fixture run (helper — shared by scripts/screenshots.ts and scripts/smoke.ts).
#
# Assumes a Release build with EXPO_PUBLIC_SCREENSHOTS=1 or EXPO_PUBLIC_SMOKE=1, app data cleared
# and fixtures pushed by the runner. The app's own bootstrap restores the backup zip and starts the
# replay session before it mounts, so this wait covers a database restore plus a replay handshake.
#
# Waiting on `battery-bar` rather than a blind settle: it is the first thing on screen that can only
# be there once the live session is delivering, which is the state both runs need and neither can
# assert by watching animations stop.
appId: ${APP_ID}
---
- launchApp
# A fresh hosted Android image can stall Pixel Launcher during app installation. Its system
# dialog owns the accessibility tree even when Vescape is running underneath. Check between
# bounded waits because the dialog can appear after launch. Never dismiss Vescape's own ANR.
- retry:
    maxRetries: 2
    commands:
      # iOS can show this prompt despite simctl privacy grant. Only tap when it exists; an optional
      # tap can spend minutes searching for an absent alert on a hosted simulator. Recheck between
      # battery waits so a late first-launch prompt is still handled.
      - runFlow:
          when:
            platform: iOS
          commands:
            - runFlow:
                when:
                  visible: 'Allow While Using App'
                commands:
                  - tapOn:
                      text: 'Allow While Using App'
                      waitToSettleTimeoutMs: 1000
      - runFlow:
          when:
            visible: "Pixel Launcher isn't responding"
          commands:
            - tapOn:
                id: android:id/aerr_close
      - extendedWaitUntil:
          visible:
            id: battery-bar
          timeout: 20000
