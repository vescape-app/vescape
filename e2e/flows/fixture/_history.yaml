# Open History from the live dashboard. A tap can be swallowed while telemetry is rendering.
# Retry only this navigation and require the drawer before continuing to either history flow. The
# drawer reopens on the last tab used, so it is put back on Rides for callers that expect the list.
appId: ${APP_ID}
---
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: history-button
          waitToSettleTimeoutMs: 1000
      - extendedWaitUntil:
          visible:
            id: history-drawer
          timeout: 15000
- tapOn:
    id: history-drawer-tab-rides
