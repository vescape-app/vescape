appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${typeof HOME_EXIT_ID !== 'undefined'}
    commands:
      - tapOn:
          id: ${HOME_EXIT_ID}
          waitToSettleTimeoutMs: 1000
- runFlow:
    when:
      true: ${typeof HOME_EXIT_ID === 'undefined'}
    commands:
      - runFlow:
          when:
            visible:
              id: weather-exit
          commands:
            - tapOn:
                id: weather-exit
      - runFlow:
          when:
            visible:
              id: legal-limits-exit
          commands:
            - tapOn:
                id: legal-limits-exit
      - runFlow:
          when:
            visible:
              id: history-back
          commands:
            - tapOn:
                id: history-back
      - runFlow:
          when:
            visible:
              id: social-drawer-backdrop
          commands:
            - tapOn:
                id: social-drawer-backdrop
      - runFlow:
          when:
            visible:
              id: header-back
          commands:
            - tapOn:
                id: header-back
      - runFlow:
          when:
            visible:
              id: map-exit
          commands:
            - tapOn:
                id: map-exit
- extendedWaitUntil:
    visible:
      id: battery-bar
    timeout: 30000
