appId: ${APP_ID}
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Speed'
          commands:
            - tapOn:
                id: gauge-speed
                waitToSettleTimeoutMs: 1000
      - extendedWaitUntil:
          visible: 'Speed'
          timeout: 15000
