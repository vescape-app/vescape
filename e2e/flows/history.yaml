appId: ${APP_ID}
---
- runFlow: _launch.yaml
- openLink: 'vescape://e2e-seed?flow=history'
- extendedWaitUntil:
    visible: E2E History Board
    timeout: 15000

- tapOn:
    id: history-button
- extendedWaitUntil:
    visible: History
    timeout: 15000

# The drawer opens on riding totals and the ride list; the newest ride has to be opened for its stats.
- tapOn:
    id: history-latest-ride

- assertVisible: Distance
- assertVisible: Top Speed
- assertVisible: '1.5'
# Stat values and their units are separate Text nodes, so the unit cannot share the selector.
- assertVisible: '25'

# Expand the stats panel to verify secondary stats are computed too.
- tapOn:
    id: history-stats-bar
- assertVisible: Avg Speed
- assertVisible: Time
- assertVisible: Ctrl Max
- assertVisible: Motor Max

# Toggle optional charts on and off. The chart headings are drawn on the Skia canvas and never
# reach the view hierarchy, so each chart is asserted through its tab's selected state.
- tapOn:
    id: history-metric-tab-battery
- extendedWaitUntil:
    visible:
      id: history-metric-tab-battery
      selected: true
    timeout: 20000
- tapOn:
    id: history-metric-tab-duty
- extendedWaitUntil:
    visible:
      id: history-metric-tab-duty
      selected: true
    timeout: 20000

# Switch to the older ride with the prev button.
- tapOn:
    id: history-previous-ride
- extendedWaitUntil:
    visible: '800'
    timeout: 20000
- assertVisible: '20'

# Charts should still be enabled on the older ride.
- assertVisible:
    id: history-metric-tab-battery
    selected: true
- assertVisible:
    id: history-metric-tab-duty
    selected: true

# Switch back to the newest ride with the next button.
- tapOn:
    id: history-next-ride
- extendedWaitUntil:
    visible: '1.5'
    timeout: 20000
# Stat values and their units are separate Text nodes, so the unit cannot share the selector.
- assertVisible: '25'

# Open the ride list sheet and verify it renders.
- tapOn:
    id: history-ride-list-button
- extendedWaitUntil:
    visible:
      id: history-session-sheet
    timeout: 20000

# Close the sheet by tapping the backdrop.
- tapOn:
    id: history-session-sheet-backdrop

# Favorites is a filtered History tab: newest Favorite opens immediately and keeps the same nav.
- tapOn:
    id: history-favorite-ride
- assertVisible:
    id: trim-favorite-name
- assertNotVisible:
    id: history-ride-list-button
- tapOn:
    id: trim-favorite-name
- eraseText
- inputText: Evening ride
- tapOn:
    id: trim-save
# Saving opens the new Favorite immediately.
- extendedWaitUntil:
    visible:
      id: favorite-edit
    timeout: 20000
- assertVisible: Evening ride
- tapOn:
    id: favorite-edit
- assertVisible:
    id: trim-favorite-name
- tapOn:
    id: trim-favorite-name
- eraseText
- inputText: Edited ride
- tapOn:
    id: trim-save
- extendedWaitUntil:
    visible:
      id: favorite-edit
    timeout: 20000
- assertVisible: Edited ride
- tapOn:
    id: history-ride-list-button
- extendedWaitUntil:
    visible:
      id: history-session-sheet
    timeout: 20000
- tapOn:
    id: history-session-sheet-backdrop
- tapOn:
    id: history-tab-history
- assertNotVisible: No rides yet
- assertVisible: '1.5'
