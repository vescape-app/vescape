appId: ${APP_ID}
---
- runFlow: _launch.yaml
- openLink: 'vescape://e2e-seed?flow=history'
- extendedWaitUntil:
    visible: E2E History Board
    timeout: 15000

- runFlow: fixture/_history.yaml

- tapOn:
    id: history-latest-ride

- assertVisible: Distance
- assertVisible: Top Speed
- assertVisible: '1.5'
- assertVisible: '25'

- tapOn:
    id: history-stats-bar
- assertVisible: Avg Speed
- assertVisible: Time
- assertVisible: Ctrl Max
- assertVisible: Motor Max

- tapOn:
    id: history-metric-tab-battery
- extendedWaitUntil:
    visible:
      id: history-metric-tab-battery
      selected: true
    timeout: 20000
- tapOn:
    id: history-metric-tab-duty
- extendedWaitUntil:
    visible:
      id: history-metric-tab-duty
      selected: true
    timeout: 20000

- tapOn:
    id: history-previous-ride
- extendedWaitUntil:
    visible: '800'
    timeout: 20000
- assertVisible: '20'

- assertVisible:
    id: history-metric-tab-battery
    selected: true
- assertVisible:
    id: history-metric-tab-duty
    selected: true

- tapOn:
    id: history-next-ride
- extendedWaitUntil:
    visible: '1.5'
    timeout: 20000
- assertVisible: '25'

- tapOn:
    id: history-ride-list-button
- extendedWaitUntil:
    visible:
      id: history-session-sheet
    timeout: 20000

- tapOn:
    id: history-session-sheet-backdrop
- extendedWaitUntil:
    notVisible:
      id: history-session-sheet-backdrop
    timeout: 10000

- tapOn:
    id: history-favorite-ride
- assertVisible:
    id: trim-favorite-name
- assertNotVisible:
    id: history-ride-list-button
- tapOn:
    id: trim-favorite-name
- eraseText
- inputText: Evening ride
- tapOn:
    id: trim-save
- extendedWaitUntil:
    visible:
      id: favorite-edit
    timeout: 20000
- assertVisible: Evening ride
- tapOn:
    id: favorite-edit
- assertVisible:
    id: trim-favorite-name
- tapOn:
    id: trim-favorite-name
- eraseText
- inputText: Edited ride
- tapOn:
    id: trim-save
- extendedWaitUntil:
    visible:
      id: favorite-edit
    timeout: 20000
- assertVisible: Edited ride
- tapOn:
    id: history-ride-list-button
- extendedWaitUntil:
    visible:
      id: history-session-sheet
    timeout: 20000
- tapOn:
    id: history-session-sheet-backdrop
- extendedWaitUntil:
    notVisible:
      id: history-session-sheet-backdrop
    timeout: 10000
- tapOn:
    id: history-tab-history
- assertVisible:
    id: history-tab-history
    selected: true
- assertNotVisible: No rides yet
- assertVisible: '1.5'
