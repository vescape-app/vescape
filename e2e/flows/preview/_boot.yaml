appId: ${APP_ID}
---
- runFlow: ../fixture/_boot.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 3
          commands:
            - runScript:
                file: _recorder.js
                env:
                  ACTION: dwell
                  MS: 30000
- assertVisible:
    id: floating-bar-record
