# Ride detail with the optional charts on: duty cycle plus both temperature traces.
appId: ${APP_ID}
---
# History opens on its overview drawer; the newest ride is the first Last rides card.
- runFlow: ../fixture/_history.yaml
- tapOn:
    id: history-latest-ride
- extendedWaitUntil:
    visible:
      id: history-metric-tab-duty
    timeout: 30000
- tapOn:
    id: history-metric-tab-duty
- tapOn:
    id: history-metric-tab-tempMotor
- tapOn:
    id: history-metric-tab-tempController
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: ${OUT_DIR}/08-history-detail
- runFlow: ../fixture/_home.yaml
