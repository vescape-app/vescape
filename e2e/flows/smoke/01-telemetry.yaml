# Live telemetry off the replayed recording, through the real native stack.
#
# This is the flow the whole smoke run exists for. Everything on this screen was decoded from
# recorded BLE chunks by native, reassembled, run through the telemetry pipeline and pushed to JS —
# the path a real ride takes. Under `EXPO_PUBLIC_E2E` all of that would be `e2eFake` returning
# canned values, which is why smoke deliberately does not set it.
appId: ${APP_ID}
---
# The session is a replay, not a board. Asserting the badge first means a later failure cannot be
# blamed on having tested the wrong kind of session.
- assertVisible:
    id: replay-badge

- assertVisible:
    id: gauge-speed
- assertVisible:
    id: gauge-duty
- assertVisible:
    id: telemetry-motor-temp-cell
- assertVisible:
    id: telemetry-controller-temp-cell
- assertVisible:
    id: telemetry-motor-current-cell
- assertVisible:
    id: telemetry-battery-current-cell
- assertVisible:
    id: battery-bar

# Deliberately no assertion on a live number here. The gauge is drawn in Skia and the strip's values
# go through `TickText`, which formats on the UI thread precisely so it does not re-render React —
# neither reaches Maestro's view hierarchy, so an assert on "24 km/h" would fail on a perfectly
# healthy screen. Liveness is carried by `battery-bar` and `replay-badge` instead: both are gated on
# a session that is actually delivering, and `_boot` will not get past them otherwise.

# Detail panels are the same telemetry under a different presentation, and they are where a broken
# unit or a missing field shows up as text rather than as a needle.
- tapOn:
    id: gauge-speed
- extendedWaitUntil:
    visible: 'Speed'
    timeout: 15000
- runFlow: ../fixture/_home.yaml

- tapOn:
    id: battery-bar
- extendedWaitUntil:
    visible: 'Battery'
    timeout: 15000
- runFlow: ../fixture/_home.yaml
