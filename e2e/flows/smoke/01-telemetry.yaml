appId: ${APP_ID}
---
- assertVisible:
    id: board-disconnect-button

- assertVisible:
    id: gauge-speed
- assertVisible:
    id: gauge-duty
- assertVisible:
    id: telemetry-motor-temp-cell
- assertVisible:
    id: telemetry-controller-temp-cell
- assertVisible:
    id: battery-bar

- runFlow: ../fixture/_speed.yaml

- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: header-back

- tapOn:
    id: battery-bar
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: 'Battery'
    timeout: 15000
- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: header-back
