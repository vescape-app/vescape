# Sound pack selection, then battery presets expanding to charge-percentage voice points.
# Run before add-board, which changes the selected board and ends the replay.
# Split from the speed flow: together they outlast the Android emulator job's step timeout.
appId: ${APP_ID}
---
# One non-default effects/voice pair, then the normal alert workflow. Picking
# HEV also picks its matching Radio voice; explicitly override it with Nicole.
- tapOn:
    id: settings-drawer-trigger
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: 'More settings'
    direction: DOWN
- tapOn:
    text: 'More settings'
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      # iOS combines the settings row's title and hint into one accessibility label.
      text: 'Sounds.*'
    direction: DOWN
- tapOn:
    text: 'Sounds.*'
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: 'Sound effects'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'HEV'
    direction: DOWN
- tapOn:
    text: 'HEV'
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: 'Play Warning'
    direction: DOWN
- tapOn:
    text: 'Play Warning'
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: 'Radio'
    direction: DOWN
- tapOn: 'Radio'
- tapOn: 'Nicole'
- assertVisible: 'Nicole'
# Return through both settings routes using the same controls on Android/iOS.
- tapOn:
    id: header-back
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Sounds.*'
- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: header-back

# Battery expands to discrete SoC voice points using the fixture Board's battery
# config, rather than speed's Geiger range. Verify the resolved points, not only
# the selected slider label.
- tapOn:
    id: battery-bar
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: 'Battery'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: alert-level-battery-safe
    direction: DOWN
- assertVisible: 'Normal, selected'
- assertVisible: 'Speaks the charge left at 50%, 35%, 20%, 10% and 5%.'
- assertVisible:
    id: alert-test-battery
    enabled: true
# Let the native preview sweep finish with the selected effects and voice.
# The following preset change and reopen must still work after playback.
- tapOn:
    id: alert-test-battery
    waitToSettleTimeoutMs: 1000
# A loaded CI emulator can spend over a minute inside the tap above, so the sweep may already have
# finished by the time Maestro looks. "Stop" is therefore best-effort; reaching "Preview" again
# below is what proves playback ended and the button recovered.
- extendedWaitUntil:
    visible: 'Stop'
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 60000
- tapOn:
    id: alert-level-battery-safe
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Safe, selected'
- assertVisible: 'Speaks the charge left at 50%, 40%, 30%, 20%, 15%, 10% and 5%.'
- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: header-back
- tapOn:
    id: battery-bar
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: 'Battery'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: alert-level-battery-safe
    direction: DOWN
- assertVisible: 'Safe, selected'
- assertVisible: 'Speaks the charge left at 50%, 40%, 30%, 20%, 15%, 10% and 5%.'
- tapOn:
    id: alert-level-battery-off
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Off, selected'
- assertVisible: 'No sound from this metric.'
- assertVisible:
    id: alert-test-battery
    enabled: false
- tapOn:
    id: alert-level-battery-normal
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Normal, selected'
- assertVisible: 'Speaks the charge left at 50%, 35%, 20%, 10% and 5%.'
- assertVisible:
    id: alert-test-battery
    enabled: true
- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: header-back
