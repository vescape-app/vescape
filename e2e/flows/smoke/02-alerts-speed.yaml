# Speed presets and a rider-owned custom rule coexist through the real native alert store.
# Run before add-board, which changes the selected board and ends the replay.
# Split from the battery flow: together they outlast the Android emulator job's step timeout.
appId: ${APP_ID}
---
- runFlow: ../fixture/_speed.yaml
- assertVisible: 'Normal, selected'
# The fixture has no custom speed rule at this range. Keep the default Geiger
# range so this tests saving and preset independence rather than ruler gestures.
- assertNotVisible: '35 km/h – 45 km/h'
- scrollUntilVisible:
    element:
      text: 'Add custom alert'
    direction: DOWN
- tapOn:
    text: 'Add custom alert'
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Add Alert'
# Maestro text matching ignores case by default; distinguish the save button
# from the drawer title "Add Alert".
- scrollUntilVisible:
    element:
      text: '(?-i:Add alert)'
    direction: DOWN
- tapOn:
    text: '(?-i:Add alert)'
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: '35 km/h – 45 km/h'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: alert-level-speed-safe
    direction: UP
- tapOn:
    id: alert-level-speed-safe
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Safe, selected'
- assertVisible: '35 km/h – 45 km/h'
- tapOn:
    id: alert-level-speed-off
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Off, selected'
- assertVisible: '35 km/h – 45 km/h'
- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: header-back
- runFlow: ../fixture/_speed.yaml
- extendedWaitUntil:
    visible: 'Off, selected'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '35 km/h – 45 km/h'
    direction: DOWN
- assertVisible: '35 km/h – 45 km/h'
# Restore the preset used by the other smoke flows.
- scrollUntilVisible:
    element:
      id: alert-level-speed-normal
    direction: UP
- tapOn:
    id: alert-level-speed-normal
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Normal, selected'
- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: header-back
