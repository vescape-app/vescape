appId: ${APP_ID}
---
- runFlow: ../fixture/_map-mode.yaml

- tapOn:
    id: map-mode-weather
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: weather-exit
    timeout: 30000
- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: weather-exit

- runFlow: ../fixture/_map-mode.yaml
- tapOn:
    id: map-mode-legal-limits
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: legal-limits-exit
    timeout: 30000
- assertVisible: 'Show legal limits list'
- tapOn:
    text: 'Show legal limits list'
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: 'Austria legal limits'
    timeout: 15000

- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: legal-limits-exit
