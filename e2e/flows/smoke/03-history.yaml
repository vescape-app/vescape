appId: ${APP_ID}
---
- runFlow: ../fixture/_history.yaml

- extendedWaitUntil:
    visible:
      id: history-latest-ride
    timeout: 30000
- tapOn:
    id: history-latest-ride
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: history-metric-tab-duty
    timeout: 30000

- assertVisible:
    id: history-stat-distance
- assertVisible:
    id: history-stat-topSpeed

- tapOn:
    id: history-stats-bar
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: history-stat-avgSpeed
- assertVisible:
    id: history-stat-rideTime
- assertVisible:
    id: history-stat-mosfetTemp
- assertVisible:
    id: history-stat-motorTemp

- tapOn:
    id: history-metric-tab-duty
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: chart-row-duty
    timeout: 30000
- tapOn:
    id: history-metric-tab-tempMotor
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: chart-row-tempMotor
    timeout: 30000
- tapOn:
    id: history-metric-tab-tempController
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: chart-row-tempController
    timeout: 30000

- tapOn:
    id: history-ride-list-button
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: history-session-sheet
    timeout: 10000
- tapOn:
    point: 50%,15%
- extendedWaitUntil:
    notVisible:
      id: history-session-sheet
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: history-back
    timeout: 15000

- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: history-back
