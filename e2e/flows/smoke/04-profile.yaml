# Profile stats from the restored fixture database.
# Verify the default month, then select and deselect the recorded month.
appId: ${APP_ID}
---
- runFlow: ../fixture/_history.yaml
- extendedWaitUntil:
    visible:
      id: history-stats-details
    timeout: 15000
- tapOn:
    id: history-stats-details
    waitToSettleTimeoutMs: 1000

- extendedWaitUntil:
    visible:
      id: profile-stats-section
    timeout: 30000
- assertVisible: '(?i)all time'
- assertVisible: '(?i)monthly stats'
- assertVisible: '(?i)distance · km'
- assertVisible:
    id: profile-selected-month-stats
- assertVisible: '.*Distance.*'
- assertVisible: '.*Rides.*'
- assertVisible: '.*Ride time.*'
- assertVisible: '.*Top speed.*'

- tapOn:
    id: profile-month-2026-08
- assertVisible: '(?i)august 2026'
- assertVisible:
    id: profile-monthly-chart
- assertVisible:
    id: profile-all-time-stats
- tapOn:
    id: profile-month-2026-08
- assertNotVisible:
    id: profile-selected-month-stats
- assertVisible: '(?i)all time'
- assertVisible:
    id: profile-monthly-chart

- runFlow:
    file: ../fixture/_home.yaml
    env:
      HOME_EXIT_ID: header-back
