# Add-board wizard, end to end, against the fake BLE scan.
#
# Runs LAST on purpose. Saving a board hands it to the connection manager, which goes at the real
# native BLE stack — the scan result is a fake standing in for absent radio hardware, so nothing
# answers and the attempt tears the replay session down with it. Every flow that needs live
# telemetry has already run by then.
#
# Connecting the created board is deliberately not asserted here: a replay session runs under a
# synthetic `replay:` board id (ADR 0024), so it cannot stand in for this board's session. Binding a
# replay to a chosen board id is native work — see the follow-up issue — and until it exists, the
# board-connect path stays covered by the E2E suite's `connect-board` flow against `e2eFake`.
#
# The wizard is therefore driven down its offline branch, which is a real product path rather than a
# workaround: it is what a rider gets when the board is out of range.
appId: ${APP_ID}
---
# End the replay session first. `bleStore.startScan()` returns immediately while a session is
# connected — the app does not scan mid-ride — so the wizard's pair step would sit on "No boards
# found" forever with the replay running. A rider adding a second board does exactly this.
#
# Conditional, because by the time the run reaches this flow the replay may have ended on its own:
# the fixture recording is 13 minutes and a full pass can outlast it (Maestro spends most of its
# time waiting for a live hierarchy to settle). Either way the next step needs a session that is
# over, so both routes are correct — this one must not care which happened.
- runFlow:
    when:
      visible:
        id: board-disconnect-button
    commands:
      - tapOn:
          id: board-disconnect-button
- extendedWaitUntil:
    visible:
      id: floating-bar-connect
    timeout: 30000

- tapOn:
    id: board-selector-trigger
- tapOn:
    id: board-selector-add-board

- extendedWaitUntil:
    visible: Pair your board
    timeout: 15000
- extendedWaitUntil:
    visible: E2E VESC Board
    timeout: 15000
- tapOn: E2E VESC Board

# Selecting a device runs a Board Probe, which opens a real BLE connection to the advertised MAC —
# and the advertisement is a fake standing in for hardware that is not there, so the link fails.
# That is the correct outcome, not a defect, and the wizard offers the path a rider takes when the
# board is out of range or powered down. Taking it here covers the link-failure UI *and* the rest of
# the wizard, without faking a probe result: the fake is for absent hardware, never for absent data.
#
# The link timeline is taller than the screen, so the failure actions sit below the fold and have to
# be scrolled to — `assertVisible` means visible in the viewport, not merely present. That goes for
# the retry button too: waiting on it in the viewport can never pass, however long the timeout.
- scrollUntilVisible:
    element:
      id: add-board-link-retry
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: add-board-link-offline
    direction: DOWN
- tapOn:
    id: add-board-link-offline

- assertVisible: Name your board
- tapOn:
    id: add-board-name-input
- eraseText
- inputText: Smoke Board
# Tapping the step's own title blurs the input, which is what dismisses the keyboard. `hideKeyboard`
# cannot be used here: on Android Maestro implements it as a back press, so on the runs where the
# keyboard is already down it pops the wizard modal instead and the flow lands back on the main
# screen with nothing to say why. Blurring is the same intent without the second meaning.
- tapOn: Name your board
- scrollUntilVisible:
    element:
      id: add-board-name-next
    direction: DOWN
- tapOn:
    id: add-board-name-next

- assertVisible: Battery config
- tapOn:
    id: add-board-battery-series-increment
- tapOn:
    id: add-board-battery-next

# Alerts is its own wizard step (PAIR · NAME · BATTERY · ALERTS · CONFIRM). Skipping it is a real
# choice a rider makes, and it keeps this flow about the wizard rather than about alert defaults.
- extendedWaitUntil:
    visible:
      id: add-board-skip-alerts
    timeout: 15000
- tapOn:
    id: add-board-skip-alerts

- assertVisible: Review & save
- assertVisible: Smoke Board
# No linked device on the review step, on purpose: this board was created offline, so there is
# nothing paired to name. The E2E suite's linked-board flow is what covers the paired variant.
- tapOn:
    id: add-board-save

# The wizard's whole point is that the board is durable afterwards. Asserting the name on the main
# screen covers the write and the read back, which is all this flow can claim without a connection.
- extendedWaitUntil:
    visible: Smoke Board
    timeout: 15000
