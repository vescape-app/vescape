appId: ${APP_ID}
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: board-disconnect-button
          commands:
            - tapOn:
                id: board-disconnect-button
                waitToSettleTimeoutMs: 1000
      - extendedWaitUntil:
          visible:
            id: floating-bar-connect
          timeout: 30000

- tapOn:
    id: board-selector-trigger
- tapOn:
    id: board-selector-add-board

- extendedWaitUntil:
    visible: Pair your board
    timeout: 15000
- extendedWaitUntil:
    visible: E2E VESC Board
    timeout: 15000
- tapOn: E2E VESC Board

- scrollUntilVisible:
    element:
      id: add-board-link-retry
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: add-board-link-offline
    direction: DOWN
- tapOn:
    id: add-board-link-offline

- assertVisible: Personalize your board
- tapOn:
    text: '.*Name your board'
    point: '95%,50%'
- eraseText
- inputText: Smoke Board
- assertVisible: 'Smoke Board(, Name your board)?'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: add-board-name-next
    direction: DOWN
- tapOn:
    id: add-board-name-next

- assertVisible: Battery config
- tapOn:
    id: add-board-battery-series-increment
- tapOn:
    id: add-board-battery-next

- extendedWaitUntil:
    visible:
      id: add-board-skip-alerts
    timeout: 15000
- tapOn:
    id: add-board-skip-alerts

- assertVisible: Review & save
- assertVisible: Smoke Board
- tapOn:
    id: add-board-save

- extendedWaitUntil:
    visible: 'Smoke Board.*'
    timeout: 30000
