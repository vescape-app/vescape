appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: No board
    timeout: 180000
- tapOn:
    id: social-drawer-trigger
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: 'Always\..*'
    timeout: 60000
- tapOn:
    text: 'Always\..*'
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: public-ride-manual-sharing
    timeout: 30000
- tapOn:
    id: public-ride-manual-sharing
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: Wait for my board
    timeout: 30000
- extendedWaitUntil:
    visible: 'Peer, .*Board battery 12%.*'
    timeout: 60000
