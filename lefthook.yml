output:
  - failure

post-merge:
  commands:
    install:
      glob: 'bun.lock'
      run: bun install

pre-commit:
  parallel: true
  commands:
    bun-version:
      run: bun run scripts/check-bun.ts
    format:
      glob: '*.{ts,tsx,json,md,yml,yaml}'
      run: >-
        set --; for f in {staged_files}; do [ -L "$f" ] || set -- "$@" "$f"; done;
        [ $# -eq 0 ] || bun fmt "$@"
      stage_fixed: true
    skills-check:
      glob: '{.agents,.claude}/skills/**'
      run: bun run skills-check
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      run: bun run ts
    theme-colors:
      glob: '*.{ts,tsx}'
      run: bun run theme:colors:check
    lint:
      glob: '*.{ts,tsx,json}'
      run: bun run lint
    comments-check:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,kt,kts,swift,gradle,py,rb}'
      run: bun run comments:check --staged
    knip:
      glob: '*.{ts,tsx,json}'
      run: bun knip
    test-bun:
      glob: '*.{ts,tsx}'
      run: bun run test:bun
    test-android:
      glob: '*.{kt,kts,gradle}'
      run: >-
        if printf '%s\n' {staged_files} | grep -q '^watch/wearos/'; then bun x expo prebuild --platform android --no-install; fi
        && bun run test:android && bun run lint:android
    test-ios:
      glob: '*.swift'
      run: bun run test:ios

commit-msg:
  commands:
    commit-policy:
      run: bun run scripts/git-hooks/policy.ts commit-msg "{1}"

pre-push:
  commands:
    bun-version:
      run: bun run scripts/check-bun.ts
    commit-policy:
      run: bun run scripts/git-hooks/policy.ts pre-push
      use_stdin: true
