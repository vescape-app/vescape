buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Keep in sync with rootProject ext.kotlinVersion (Expo version catalog "kotlin"), like
    // vescape-core pins ksp. The Compose compiler plugin is Kotlin-version-locked.
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.1.20"
  }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseVersionName = project.findProperty('APP_VERSION')?.toString() ?: '1.0.0'
def releaseVersionCode = (project.findProperty('WEAR_VERSION_CODE') ?: '1').toString().toInteger()
def releaseSigningProperties = [
  'VESCAPE_UPLOAD_STORE_FILE',
  'VESCAPE_UPLOAD_STORE_PASSWORD',
  'VESCAPE_UPLOAD_KEY_ALIAS',
  'VESCAPE_UPLOAD_KEY_PASSWORD',
]
def hasReleaseSigning = releaseSigningProperties.every {
  project.hasProperty(it) && project.property(it).toString()
}

android {
  namespace 'app.vescape.wear'
  compileSdk 35

  defaultConfig {
    // Share the phone applicationId so a store build delivers this as the watch form factor.
    applicationId 'app.vescape'
    minSdk 30
    targetSdk 35
    versionCode releaseVersionCode
    versionName releaseVersionName
  }

  buildFeatures {
    compose true
  }

  signingConfigs {
    release {
      if (hasReleaseSigning) {
        storeFile file(project.property('VESCAPE_UPLOAD_STORE_FILE'))
        storePassword project.property('VESCAPE_UPLOAD_STORE_PASSWORD')
        keyAlias project.property('VESCAPE_UPLOAD_KEY_ALIAS')
        keyPassword project.property('VESCAPE_UPLOAD_KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (hasReleaseSigning) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
  implementation composeBom
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.core:core-splashscreen:1.0.1'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.fragment:fragment:1.8.5'
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.wear:wear:1.3.0'
  implementation 'androidx.wear.compose:compose-material:1.4.1'
  implementation 'androidx.wear.compose:compose-foundation:1.4.1'
  implementation 'androidx.wear:wear-ongoing:1.1.0'
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
  testImplementation 'junit:junit:4.13.2'
  // Real org.json on the JVM: the android.jar stub throws, and the replay fixture parser is JSON.
  testImplementation 'org.json:json:20240303'
}
